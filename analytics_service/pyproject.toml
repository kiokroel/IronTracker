[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irontracker-analytics-service"
version = "0.1.0"
description = "IronTracker Analytics Service (Async Consumer + Kafka + MongoDB Time Series)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "motor>=3.4.0",
    "pymongo>=4.6.0",
    "aiokafka>=0.10.0",
    "python-dotenv>=1.0.1",
]
