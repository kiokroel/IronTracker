name: irontracker-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: irontracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-irontracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irontracker_secret}
      POSTGRES_DB: ${POSTGRES_DB:-irontracker_workout}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - irontracker-network

  redis:
    image: redis:7-alpine
    container_name: irontracker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - irontracker-network

  mongodb:
    image: mongo:7.0
    container_name: irontracker-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-irontracker}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-irontracker_mongo_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-irontracker_analytics}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - irontracker-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: irontracker-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: '4L622nShTUiBenA3y5ZMmQ'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - irontracker-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: irontracker-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-irontracker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-irontracker_rabbit_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - irontracker-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: irontracker-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irontracker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - irontracker-network
    profiles:
      - tools

  # ==============================================================================
  # IronTracker Application Services & Background Workers
  # ==============================================================================

  workout-service:
    build:
      context: .
      dockerfile: workout_service/Dockerfile
    image: irontracker-workout-service:latest
    container_name: irontracker-workout-service
    restart: unless-stopped
    command: python -m uvicorn workout_service.src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${WORKOUT_SERVICE_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-irontracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irontracker_secret}
      POSTGRES_DB: ${POSTGRES_DB:-irontracker_workout}
      DB_ECHO: "false"
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - irontracker-network

  workout-outbox-processor:
    build:
      context: .
      dockerfile: workout_service/Dockerfile
    image: irontracker-workout-service:latest
    container_name: irontracker-workout-outbox-processor
    restart: unless-stopped
    command: python -m workout_service.src.worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-irontracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irontracker_secret}
      POSTGRES_DB: ${POSTGRES_DB:-irontracker_workout}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_WORKOUT_TOPIC: workout.events
      OUTBOX_POLL_INTERVAL: "1.0"
      OUTBOX_BATCH_SIZE: "50"
      OUTBOX_MAX_RETRIES: "3"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - irontracker-network

  leaderboard-service:
    build:
      context: .
      dockerfile: leaderboard_service/Dockerfile
    image: irontracker-leaderboard-service:latest
    container_name: irontracker-leaderboard-service
    restart: unless-stopped
    command: python -m uvicorn leaderboard_service.src.main:app --host 0.0.0.0 --port 8002
    ports:
      - "${LEADERBOARD_SERVICE_PORT:-8002}:8002"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      LEADERBOARD_TONNAGE_KEY: leaderboard:tonnage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - irontracker-network

  leaderboard-consumer:
    build:
      context: .
      dockerfile: leaderboard_service/Dockerfile
    image: irontracker-leaderboard-service:latest
    container_name: irontracker-leaderboard-consumer
    restart: unless-stopped
    command: python -m leaderboard_service.src.worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: leaderboard-service-group
      KAFKA_WORKOUT_TOPIC: workout.completed
      LEADERBOARD_TONNAGE_KEY: leaderboard:tonnage
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - irontracker-network

  analytics-worker:
    build:
      context: .
      dockerfile: analytics_service/Dockerfile
    image: irontracker-analytics-service:latest
    container_name: irontracker-analytics-worker
    restart: unless-stopped
    command: python -m analytics_service.src.worker
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-irontracker}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-irontracker_mongo_secret}
      MONGO_DB: ${MONGO_DB:-irontracker_analytics}
      MONGO_AUTH_SOURCE: admin
      MONGO_COLLECTION_NAME: workout_metrics
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: analytics-service-group
      KAFKA_WORKOUT_TOPIC: workout.events
      ENABLE_KAFKA_CONSUMER: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - irontracker-network

  notification-worker:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    image: irontracker-notification-service:latest
    container_name: irontracker-notification-worker
    restart: unless-stopped
    command: python -m notification_service.src.worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-irontracker}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-irontracker_rabbit_secret}
      RABBITMQ_VHOST: "/"
      RABBITMQ_QUEUE: notifications_queue
      RABBITMQ_EXCHANGE: notifications_exchange
      RABBITMQ_ROUTING_KEY: notification.dispatch
      RABBITMQ_DLX_EXCHANGE: notifications_dlx
      RABBITMQ_DLQ_QUEUE: notifications_dlq
      RABBITMQ_DLX_ROUTING_KEY: notification.dead_letter
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - irontracker-network

  users-service:
    build:
      context: .
      dockerfile: users_service/Dockerfile
    image: irontracker-users-service:latest
    container_name: irontracker-users-service
    restart: unless-stopped
    command: python -m uvicorn users_service.src.main:app --host 0.0.0.0 --port 8001
    ports:
      - "${USERS_PORT:-8001}:8001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-irontracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irontracker_secret}
      POSTGRES_DB: ${POSTGRES_DB:-irontracker_workout}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-irontracker_super_secure_jwt_secret_key_2026_dev}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - irontracker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: irontracker-frontend:latest
    container_name: irontracker-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - irontracker-network

  caddy:
    image: caddy:2-alpine
    container_name: irontracker-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      users-service:
        condition: service_healthy
      workout-service:
        condition: service_healthy
      leaderboard-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - irontracker-network

networks:
  irontracker-network:
    name: irontracker-network
    driver: bridge

volumes:
  postgres_data:
    name: irontracker_postgres_data
  redis_data:
    name: irontracker_redis_data
  mongo_data:
    name: irontracker_mongo_data
  kafka_data:
    name: irontracker_kafka_data
  rabbitmq_data:
    name: irontracker_rabbitmq_data
  caddy_data:
    name: irontracker_caddy_data
  caddy_config:
    name: irontracker_caddy_config
