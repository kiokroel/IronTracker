name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Security Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: irontracker
          POSTGRES_PASSWORD: irontracker_secret
          POSTGRES_DB: irontracker_workout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: irontracker
          MONGO_INITDB_ROOT_PASSWORD: irontracker_mongo_secret
          MONGO_INITDB_DATABASE: irontracker_analytics
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand({serverStatus:1}).ok' | mongosh admin --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: irontracker
      POSTGRES_PASSWORD: irontracker_secret
      POSTGRES_DB: irontracker_workout
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MONGO_HOST: localhost
      MONGO_PORT: 27017
      MONGO_USER: irontracker
      MONGO_PASSWORD: irontracker_mongo_secret
      MONGO_DB: irontracker_analytics
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -e shared/contracts
          pip install -e ".[dev]"

      - name: Run Ruff linter and formatter check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy strict type check
        run: |
          mypy --strict workout_service/ leaderboard_service/ users_service/ shared/ tests/test_openapi_specification.py

      - name: Run Bandit security scanner (SAST)
        run: |
          bandit -r workout_service/ leaderboard_service/ analytics_service/ notification_service/ users_service/ shared/ tests/ -ll

      - name: Run pip-audit vulnerability scanner (SCA)
        run: |
          pip-audit

      - name: Apply database migrations
        run: |
          alembic -c workout_service/alembic.ini upgrade head
          alembic -c users_service/alembic.ini upgrade head

      - name: Run Pytest test suite
        run: |
          pytest tests/ -v

  frontend-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Run TypeScript type check
        run: |
          npm --prefix frontend run lint

      - name: Run frontend unit tests (Vitest)
        run: |
          npm --prefix frontend test -- --run

      - name: Build production bundle
        run: |
          npm --prefix frontend run build

  docker-validation:
    name: Docker & Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose specification
        run: |
          docker compose config --quiet

      - name: Build Docker images
        run: |
          docker compose build
