[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irontracker-leaderboard-service"
version = "0.1.0"
description = "IronTracker Leaderboard Service (FastAPI + Redis ZSET)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.3",
    "aiokafka>=0.10.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.1",
]
