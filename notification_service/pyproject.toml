[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irontracker-notification-service"
version = "0.1.0"
description = "IronTracker Notification Service (Async Consumer + RabbitMQ + DLX)"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]
